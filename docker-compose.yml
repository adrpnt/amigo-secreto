services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: amigo
      POSTGRES_PASSWORD: amigo
      POSTGRES_DB: amigo_secreto
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amigo -d amigo_secreto']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
